<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Report Commesse e Risorse</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1100px; margin: 20px auto; padding: 0 15px; color: #222; }
    #readme { background: #f4f4f4; padding: 15px; border-radius: 6px; margin-bottom: 30px; white-space: pre-wrap; }
    h2 { color: #0969da; border-bottom: 2px solid #0969da; padding-bottom: 5px; margin-top: 35px; }
    .box { overflow-x: auto; max-height: 400px; border: 1px solid #ccc; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; white-space: nowrap; }
    th { background: #eee; position: sticky; top: 0; }
    tr:nth-child(even) { background: #f9f9f9; }
  </style>
</head>
<body>

  <div id="readme">Caricamento README...</div>
  <div id="contenuto"></div>

  <script>
    const files = [
      "01_Anagrafica_Commesse.csv",
      "02_Piano_Economico_Mensile.csv",
      "03_Consuntivi_Mensili.csv",
      "04_Anagrafica_Risorse.csv",
      "05_Allocazione_Risorse.csv",
      "06_Rischi_CR.csv"
    ];

    // 1. Carica il README
    fetch("README.md")
      .then(r => r.ok ? r.text() : "")
      .then(testo => {
        document.getElementById("readme").textContent = testo;
      });

    // 2. Carica e disegna ogni CSV
    const contenitore = document.getElementById("contenuto");

    files.forEach(nomeFile => {
      const titolo = document.createElement("h2");
      titolo.textContent = nomeFile;
      contenitore.appendChild(titolo);

      const box = document.createElement("div");
      box.className = "box";
      box.textContent = "Caricamento...";
      contenitore.appendChild(box);

      fetch(nomeFile)
        .then(r => {
          if (!r.ok) throw new Error("File non trovato (" + r.status + ")");
          return r.arrayBuffer();
        })
        .then(buffer => {
          // Decodifica formato Windows/Excel italiano
          const decoder = new TextDecoder("windows-1252");
          const testo = decoder.decode(buffer);
          const righe = testo.split(/\r?\n/).filter(r => r.trim() !== "");

          if (righe.length === 0) {
            box.textContent = "File vuoto.";
            return;
          }

          // Riconosce automaticamente se il separatore è ; oppure ,
          const primaRiga = righe.at(0);
          const sep = primaRiga.includes(";") ? ";" : ",";

          const table = document.createElement("table");
          
          righe.forEach((riga, indiceRiga) => {
            const tr = document.createElement("tr");
            const celle = riga.split(sep);
            
            celle.forEach(valore => {
              const cella = document.createElement(indiceRiga === 0 ? "th" : "td");
              cella.textContent = valore.replace(/^"|"$/g, "").trim();
              tr.appendChild(cella);
            });
            
            table.appendChild(tr);
          });

          box.textContent = "";
          box.appendChild(table);
        })
        .catch(err => {
          box.textContent = "Errore nel caricamento di " + nomeFile + ": " + err.message;
        });
    });
  </script>
</body>
</html>
