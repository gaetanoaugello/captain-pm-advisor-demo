<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>I miei dati CSV</title>
  <script src="https://cloudflare.com"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
    #readme { background: #f8f9fa; padding: 1.5rem; border-radius: 8px; border: 1px solid #e1e4e8; margin-bottom: 2.5rem; }
    h2.csv-title { margin-top: 2.5rem; border-bottom: 2px solid #0969da; padding-bottom: 0.3rem; color: #0969da; }
    .table-container { overflow-x: auto; max-height: 450px; border: 1px solid #d0d7de; border-radius: 6px; margin-bottom: 2rem; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border: 1px solid #d0d7de; padding: 8px 12px; text-align: left; }
    th { background-color: #f6f8fa; position: sticky; top: 0; font-weight: 600; }
    tr:nth-child(even) { background-color: #f9fbfd; }
    .status { color: #666; font-style: italic; }
  </style>
</head>
<body>

  <div id="readme">Caricamento descrizione...</div>
  <div id="tables-wrapper"><p class="status">Ricerca dei file CSV nel repository in corso...</p></div>

  <script>
    // 1. Mostra il README.md
    fetch('README.md')
      .then(res => res.ok ? res.text() : '')
      .then(md => {
        if (md) document.getElementById('readme').innerHTML = marked.parse(md);
        else document.getElementById('readme').style.display = 'none';
      });

    // 2. Ricava utente e nome repository dall'URL di GitHub Pages
    const hostParts = window.location.hostname.split('.');
    const owner = hostParts[0];
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const repo = pathParts.length > 0 ? pathParts[0] : `${owner}.github.io`;

    // 3. Chiede a GitHub l'elenco dei file presenti nel repository
    fetch(`https://github.com{owner}/${repo}/contents/`)
      .then(res => res.json())
      .then(items => {
        const wrapper = document.getElementById('tables-wrapper');
        wrapper.innerHTML = '';

        // Filtra solo i file che finiscono con .csv (ignora maiuscole/minuscole)
        const csvFiles = items.filter(item => item.name.toLowerCase().endsWith('.csv'));

        if (csvFiles.length === 0) {
          wrapper.innerHTML = '<p>Nessun file CSV trovato nella cartella principale del repository.</p>';
          return;
        }

        // Crea una sezione e una tabella per ciascun CSV trovato
        csvFiles.forEach(file => {
          const title = document.createElement('h2');
          title.className = 'csv-title';
          title.textContent = file.name;
          wrapper.appendChild(title);

          const container = document.createElement('div');
          container.className = 'table-container';
          const table = document.createElement('table');
          container.appendChild(table);
          wrapper.appendChild(container);

          Papa.parse(file.name, {
            download: true,
            header: true,
            delimiter: ";",
            encoding: "ISO-8859-1",
            skipEmptyLines: true,
            complete: function(results) {
              if (!results.data || results.data.length === 0) return;

              const headers = Object.keys(results.data[0]);
              const thead = table.createTHead();
              const headerRow = thead.insertRow();
              headers.forEach(h => {
                const th = document.createElement('th');
                th.textContent = h;
                headerRow.appendChild(th);
              });

              const tbody = table.createTBody();
              results.data.forEach(row => {
                const tr = tbody.insertRow();
                headers.forEach(h => {
                  const td = tr.insertCell();
                  td.textContent = row[h];
                });
              });
            }
          });
        });
      })
      .catch(err => {
        document.getElementById('tables-wrapper').innerHTML = 
          '<p>Impossibile caricare la lista dei file (verifica che il repository sia pubblico).</p>';
      });
  </script>
</body>
</html>
